# fly.toml app configuration file generated for geree on 2026-07-27T14:49:22+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geree'
primary_region = 'nrt'

[build]
[env]
  PORT = '8000'
  TZ = '<+08>-8'  # Ulaanbaatar time (UTC+8); POSIX form works without tzdata

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
