services:
  - type: web
    name: contract-registry
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/contracts.db
    disk:
      name: contracts-data
      mountPath: /data
      sizeGB: 1
