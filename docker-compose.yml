services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: geree_db
      POSTGRES_USER: geree_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geree_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geree_user -d geree_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - TZ=<+08>-8
      - DATABASE_URL=postgresql://geree_user:${DB_PASSWORD:-geree_pass}@db:5432/geree_db
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  uploads:
